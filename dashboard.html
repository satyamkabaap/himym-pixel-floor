<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HIMYM · Smooth Floor</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--paper:#efe6d3;--panel:#f7f0e1;--ink:#2b2320;--line:#c9b896;--lined:#8a7a5c;--accent:#e0a43c;--accentd:#b07f22;--green:#5da668;--blue:#5b8db8;--purple:#9370db;--amber:#d99a2b;--tan:#d8c49a;--red:#c0563f}
*{box-sizing:border-box;margin:0}body{background:var(--paper);color:var(--ink);font-family:'Pixelify Sans',monospace;height:100vh;display:grid;grid-template-rows:44px 1fr 128px;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:3px solid var(--ink)}
.lights{display:flex;gap:6px}.lights i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink)}
.lights i:nth-child(1){background:#e0604f}.lights i:nth-child(2){background:#e0a43c}.lights i:nth-child(3){background:#5da668}
.logo{font-weight:700}.ver{font-size:12px;color:var(--lined)}
.statsbar{display:flex;gap:8px;margin-left:auto;font-size:11px}
.stat{padding:4px 8px;background:var(--tan);border:2px solid var(--ink);border-radius:4px}.stat b{color:var(--accentd)}
main{display:grid;grid-template-columns:1fr 430px;min-height:0}
.floorpane{background:#14100c;padding:18px;position:relative;display:flex;align-items:center;justify-content:center}
.frame{border:6px solid #f2ecdd;border-radius:4px;box-shadow:0 0 0 3px #2b2320,0 24px 60px #000c;position:relative;max-width:100%;max-height:100%;aspect-ratio:16/10}
canvas#floor{width:100%;height:100%;display:block;image-rendering:pixelated}
.timebadge{position:absolute;right:26px;top:24px;background:var(--panel);border:2px solid var(--ink);border-radius:6px;padding:6px 12px;font-size:12px;box-shadow:2px 2px 0 rgba(0,0,0,.4);z-index:5}
.epbanner{position:absolute;left:50%;top:24px;transform:translateX(-50%);background:#2b2320ee;color:#f5d76e;border:2px solid #f5d76e;border-radius:6px;padding:6px 14px;font-size:12px;z-index:5}
.recap{position:absolute;inset:0;background:rgba(10,8,6,.72);display:flex;align-items:center;justify-content:center;z-index:8}
.rcard{background:#fff7dc;color:#422d20;border:4px solid #63452e;border-radius:8px;padding:22px 28px;max-width:420px;text-align:center;box-shadow:8px 9px #000a}
.rcard .rumb{font-size:34px}.rcard h3{font-size:20px;margin:6px 0}.rcard p{font-size:13px;line-height:1.5;margin-bottom:10px}.rcard .rday{font-size:10px;color:#8a6a4a;margin-bottom:10px}
.toast{position:fixed;top:56px;right:16px;background:var(--accent);border:3px solid var(--ink);border-radius:8px;padding:10px 16px;font-weight:700;box-shadow:4px 4px 0 rgba(0,0,0,.4)}
.term{position:fixed;bottom:0;left:0;right:0;height:120px;background:#000000ee;color:#0f0;overflow:hidden;font-family:monospace;padding:6px;white-space:pre-wrap;font-size:13px}
#term{height:100%;color:#0f0}
#autoBtn{position:fixed;bottom:6px;left:14px;background:var(--panel);border:3px solid var(--ink);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer}
#autoBtn.on{background:var(--accent);color:var(--paper)}
#term::-webkit-scrollbar{width:6px}
#term::-webkit-scrollbar-track{background:#0004}
#term::-webkit-scrollbar-thumb{background:#0f0;border-radius:3px}
#term::-webkit-scrollbar-thumb:hover{background:#0a0}
</style>
</head>
<body>
<header>
<div class="lights"><i></i><i></i><i></i></div>
<div class="logo">HIMYM</div>
<div class="ver">v8.1.0</div>
<div class="statsbar">
<div class="stat">Day <b id="day">1</b></div>
<div class="stat">Time <b id="tod">morning</b></div>
<div class="stat">Cast <b id="cast">5</b></div>
<div class="stat">Ships <b id="ships">0</b></div>
</div>
</header>
<main>
<div class="floorpane">
<div class="frame">
<canvas id="floor"></canvas>
<div class="timebadge"><span id="time">00:00</span></div>
<div class="epbanner"><span id="ep"></span></div>
<div class="recap"><div class="rcard"><div class="rumb">📸</div><h3 id="recapTitle"></h3><p id="recapLine"></p><div class="rday" id="recapDay"></div></div></div>
</div>
</div>
<div id="term"></div>
<button id="autoBtn">AUTO</button>
</main>
<script>
// elements
const term=document.getElementById('term');
const dayEl=document.getElementById('day');
const todEl=document.getElementById('tod');
const castEl=document.getElementById('cast');
const shipsEl=document.getElementById('ships');
const timeEl=document.getElementById('time');
const epEl=document.getElementById('ep');
const recapTitleEl=document.getElementById('recapTitle');
const recapLineEl=document.getElementById('recapLine');
const recapDayEl=document.getElementById('recapDay');
const autoBtn=document.getElementById('autoBtn');
const canvas=document.getElementById('floor');
const ctx=canvas.getContext('2d');

// state
let state={};
let imgData={};
let scale=2;
let cellSize=22*scale; // 44px per cell
let gridCols=30; // 30 cells wide
let gridRows=22; // 22 cells tall
let floorWidth=gridCols*cellSize;
let floorHeight=gridRows*cellSize;

// resize
function resize(){
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  ctx.scale(dpr,dpr);
  // fit to frame preserving aspect
  const frame=document.querySelector('.frame');
  const fRect=frame.getBoundingClientRect();
  const scaleX=fRect.width/floorWidth;
  const scaleY=fRect.height/floorHeight;
  const s=Math.min(scaleX,scaleY);
  ctx.translate((fRect.width-floorWidth*s)/2, (fRect.height-floorHeight*s)/2);
  ctx.scale(s,s);
}
window.addEventListener('resize',resize);
resize();

// palette from :root
function getVar(name){return getComputedStyle(document.body).getPropertyValue(name).trim();}
const paper=getVar('--paper');
const panel=getVar('--panel');
const ink=getVar('--ink');
const line=getVar('--line');
const lined=getVar('--lined');
const accent=getVar('--accent');
const accentd=getVar('--accentd');
const green=getVar('--green');
const blue=getVar('--blue');
const purple=getVar('--purple');
const amber=getVar('--amber');
const tan=getVar('--tan');
const red=getVar('--red');

// sprites (22x30 grid, 2x upscale => 44x60)
// we'll draw procedurally: simple shapes for now, can be replaced with pixel art
function drawSprite(x,y,agent,frame,dir){
  // x,y in cells
  const sx=x*cellSize;
  const sy=y*cellSize;
  ctx.save();
  ctx.translate(sx,sy);
  ctx.scale(scale,scale);
  // base
  ctx.fillStyle=paper;
  ctx.fillRect(0,0,22,30);
  // outline
  ctx.strokeStyle=ink;
  ctx.lineWidth=0.5;
  ctx.strokeRect(0,0,22,30);
  // simple color by agent
  const colors={ted:blue,barney:purple,marshall:green,lily:amber,robin:red};
  const c=colors[agent]||tan;
  ctx.fillStyle=c;
  ctx.fillRect(2,2,18,26);
  // eyes
  ctx.fillStyle=ink;
  const eyeSize=2;
  const eyeY=8;
  const eyeL=6,eyeR=14;
  // blinking
  const blink=frame%40<2?0:eyeSize;
  ctx.fillRect(eyeL,eyeY,eyeSize,blink);
  ctx.fillRect(eyeR,eyeY,eyeSize,blink);
  // mouth
  ctx.fillStyle=lined;
  ctx.fillRect(8,18,6,2);
  // arms (swing)
  const swing=Math.sin(frame*0.2)*2;
  ctx.fillRect(0,12+swing,2,4);
  ctx.fillRect(20,12-swing,2,4);
  // feet
  ctx.fillStyle=lined;
  ctx.fillRect(4,28,3,2);
  ctx.fillRect(15,28,3,2);
  ctx.restore();
}

// draw floor (checker)
function drawFloor(){
  ctx.fillStyle=paper;
  ctx.fillRect(0,0,floorWidth,floorHeight);
  ctx.fillStyle=lined;
  for(let r=0;r<gridRows;r++){
    for(let c=0;c<gridCols;c++){
      if((r+c)%2===0){
        ctx.fillRect(c*cellSize,r*cellSize,cellSize,cellSize);
      }
    }
  }
}

// draw agents
function drawAgents(){
  if(!state.agents)return;
  for(const [name,data] of Object.entries(state.agents)){
    // find cell from sub_location? we'll just place randomly for demo
    // but we can use a mapping: for now random
    const x=Math.floor(Math.random()*gridCols);
    const y=Math.floor(Math.random()*gridRows);
    const frame=state.tick||0;
    drawSprite(x,y,name,frame,0);
  }
}

// render loop
function render(){
  ctx.clearRect(0,0,floorWidth,floorHeight);
  drawFloor();
  drawAgents();
  requestAnimationFrame(render);
}
render();

// UI updates
function updateUI(){
  if(!state)return;
  dayEl.textContent=state.day||1;
  todEl.textContent=state.time_of_day||'morning';
  castEl.textContent=state.agents?Object.keys(state.agents).length:0;
  shipsEl.textContent=state.stats?.tasks_done||0;
  const tod=state.time_of_day;
  const h=({'morning':9,'afternoon':14,'evening':19,'night':22}[tod]||9);
  const m=Math.floor(((state.tick||0)*state.time_scale)%60);
  timeEl.textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  epEl.textContent=state.episode?.title||'';
  if(state.recap){
    recapTitleEl.textContent=state.recap.title;
    recapLineEl.textContent=state.recap.line;
    recapDayEl.textContent=`Day ${state.recap.day}`;
  }else{
    recapTitleEl.textContent='';
    recapLineEl.textContent='';
    recapDayEl.textContent='';
  }
}
setInterval(updateUI,300);

// auto button
autoBtn.onclick=e=>{
  e.target.classList.toggle('on');
  const on=e.target.classList.contains('on');
  fetch('/api/auto',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({on})}).catch(()=>{});
  log(term,'• auto mode '+(on?'ON':'OFF'),'i');
};

// terminal log
function log(el,msg,cls=''){
  const line=document.createElement('div');
  line.textContent=msg;
  if(cls)line.className=cls;
  el.appendChild(line);
  el.scrollTop=el.scrollHeight;
}
async function loop(){
  try{
    while(true){
      const resp=await fetch('/sim_data.json');
      if(!resp.ok)throw new Error('bad status');
      state=await resp.json();
      updateUI();
    }catch(e){
      log(term,'Error: '+e,'err');
    }
    await new Promise(r=>setTimeout(r,1000));
  }
}
loop();
</script>
<link rel="stylesheet" href="ui_plus.css">
<script src="ui_plus.js"></script>
</body>
</html>
