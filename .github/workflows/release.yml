name: Release
on:
  push:
    tags: ["v*"]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests
      - name: Build exe
        run: pyinstaller --onefile --name "HIMYM_PixelFloor" --add-data "dashboard.html;." --add-data "floor_day.png;." --add-data "floor_night.png;." --add-data "agents/personas;agents/personas" director.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress
      - name: Compile installer
        run: & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HIMYM_PixelFloor.exe
            installer_output/*.exe
