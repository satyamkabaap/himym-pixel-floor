name: Release

on:
  push:
    tags:
      - 'v*'  # Pushes to matching v* tags, e.g. v1.0, v2.0.0

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    - name: Build executable
      run: |
        python -m PyInstaller --onefile --windowed --name himym-harness director.py
    - name: Create installer
      run: |
        "C:\Program Files\Inno Setup 6\ISCC.exe" installer.iss
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: himym-harness-installer
        path: Output/himym-harness-installer.exe
  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v3
    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: himym-harness-installer
        path: ./artifact
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        files: ./artifact/himym-harness-installer.exe
