name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: python -m py_compile director.py
      - run: |
          python - <<'EOF'
          import json, glob
          for f in glob.glob('agents/personas/*.json'):
              json.load(open(f, encoding='utf-8'))
          print('personas OK')
          EOF
